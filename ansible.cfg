[defaults]
# Inventory file location
inventory = inventories/dev/hosts.yml

# Roles search path
roles_path = roles

# Disable host key checking for WinRM targets
host_key_checking = False

# Increase default timeout for Windows operations (seconds)
timeout = 60

# Callback plugins for better output formatting
stdout_callback = default
result_format = yaml
callback_whitelist = timer, profile_tasks

# Retry files location (gitignored)
retry_files_save_path = logs/

# Vault password file (optional — use if you don't want interactive prompts)
# vault_password_file = .vault_pass

# Fact caching for performance
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts_cache
fact_caching_timeout = 3600

[privilege_escalation]
# Not used for Windows (Windows uses become_method: runas if needed)
become = false

[ssh_connection]
# Not applicable — we use WinRM, not SSH
# Included for completeness in mixed Linux/Windows environments
pipelining = True

[winrm_connection]
# Read timeout for WinRM operations (seconds)
read_timeout_sec = 120

# Operation timeout for WinRM operations (seconds)
operation_timeout_sec = 100
