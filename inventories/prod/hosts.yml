---
# Production inventory template
# Replace placeholder IPs with actual production endpoints
# Use Kerberos authentication in production (not NTLM)

all:
  children:
    windows:
      hosts:
        prod-ws-001:
          ansible_host: 10.10.1.101
        prod-ws-002:
          ansible_host: 10.10.1.102
        prod-srv-001:
          ansible_host: 10.10.2.50

      vars:
        ansible_connection: winrm
        ansible_port: 5986
        ansible_winrm_transport: kerberos  # Kerberos for domain-joined production
        ansible_winrm_server_cert_validation: validate  # Use CA-signed certs in prod
        ansible_winrm_scheme: https

        ansible_user: "{{ vault_winrm_user }}"
        ansible_password: "{{ vault_winrm_password }}"
