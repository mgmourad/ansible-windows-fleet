---
# Development inventory — Home lab Windows endpoints
# These are the VMs Ansible will manage via WinRM (HTTPS/5986)

all:
  children:
    windows:
      hosts:
        winvmclient1:
          ansible_host: 192.168.1.228
          # Per-host overrides can go in host_vars/win11-vm01.yml
        winvmclient2:
          ansible_host: 192.168.1.163
        winvmserver:
          ansible_host: 192.168.1.203

          # Windows Server 2022 — may have different update policies

      vars:
        # Connection settings for ALL Windows hosts
        ansible_connection: winrm
        ansible_port: 5986
        ansible_winrm_transport: ntlm
        ansible_winrm_server_cert_validation: ignore  # Self-signed certs in lab
        ansible_winrm_scheme: https

        # Credentials — pulled from vault-encrypted group_vars
        #ansible_user: "{{ ansible_user}}"
        #ansible_password: "{{ ansible_password }}"
